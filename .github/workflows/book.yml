name: Build the book and publish it to GitHub Pages

# Renders the book on every push and pull request. On a push to main it also publishes
# book/target/site to GitHub Pages:
#
#   index.html                          the book as one page
#   enterprise-ai-in-java.pdf           the book as a PDF
#   enterprise-ai-in-java.epub          the book as an EPUB
#   enterprise-ai-in-java-sources.zip   the repository as it was checked out, for those who do not use Git
#
# In the repository's Settings > Pages, set Source to "GitHub Actions".

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows the workflow to be run by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel a deployment in progress
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Zip the sources
      # Before the build, so that the zip has what is in the repository and nothing that a build made.
      # git archive takes tracked files only. The zip is written outside the workspace.
      run: git archive --format=zip --prefix=enterprise-ai-in-java/ -o "$RUNNER_TEMP/enterprise-ai-in-java-sources.zip" HEAD
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Render the book
      # Published editions leave the editor's notes out.
      # Fails on a broken cross-reference, a missing image or a missing listing tag.
      run: mvn -B verify -Dbook.editor-notes=false
    - name: Add the sources to the site
      # The name is site.sources in book/pom.xml, which the link in the book is made from.
      run: cp "$RUNNER_TEMP/enterprise-ai-in-java-sources.zip" book/target/site/
    - name: Keep the books with the run
      uses: actions/upload-artifact@v4
      with:
        name: enterprise-ai-in-java
        path: book/target/book/enterprise-ai-in-java-*.*
    - name: Upload the site for GitHub Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: book/target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
